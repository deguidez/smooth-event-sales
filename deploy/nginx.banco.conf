# Expõe o banco (Supabase auto-hospedado) para o navegador dos atletas.
#
# O site fala com o banco por 127.0.0.1, mas o celular do atleta precisa de um
# endereço público https. Crie um site novo no aaPanel chamado
# banco.evenon.com.br (com SSL) e cole o conteúdo abaixo dentro do server { }.
#
# Atenção: isso é normal em qualquer Supabase — a proteção vem das permissões
# (RLS) e das chaves, não do endereço. Ainda assim, no aaPanel → Firewall,
# deixe o painel administrativo do banco (porta 8081) acessível só para o seu IP.

client_max_body_size 300m;

location / {
  proxy_pass http://127.0.0.1:8000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
}
