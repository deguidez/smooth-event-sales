# Proxy reverso do site para o Node (porta 3000).
#
# Como usar no aaPanel:
#   Sites → seu site → Configuração → arquivo de configuração → cole o bloco
#   abaixo DENTRO do server { ... } que já existe, no lugar do conteúdo padrão
#   (mantenha as linhas do certificado SSL e do listen 443 que o aaPanel gerou).
#
# Não aponte o site para uma pasta php/python: o site é servido pelo Node.

client_max_body_size 300m;

location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_connect_timeout 30s;
}

# Asaas chama este endereço a cada mudança de pagamento.
location /webhook/asaas {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

# Cron interno (automações de e-mail e cancelamento automático).
location /api/public/cron/ {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
